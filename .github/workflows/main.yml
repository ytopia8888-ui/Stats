name: Build SkyTint APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SkyTint_NativeOverlay_Project_UPDATED.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="SkyTint_NativeOverlay_Project_UPDATED.zip"
          if [[ ! -f "$ARCHIVE" ]]; then
            echo "ERROR: Upload $ARCHIVE to the repository root without renaming it." >&2
            exit 1
          fi
          unzip -t "$ARCHIVE"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q "SkyTint_NativeOverlay_Project_UPDATED.zip" -d extracted
          SETTINGS_FILE="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERROR: No settings.gradle(.kts) found inside the ZIP." >&2
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyTint-debug-apk
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
