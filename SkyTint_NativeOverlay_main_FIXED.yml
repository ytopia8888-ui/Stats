name: Build SkyTint APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""
          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then
            PROJECT_DIR="."
          elif [[ -f SkyTint_NativeOverlay_Project/settings.gradle || -f SkyTint_NativeOverlay_Project/settings.gradle.kts ]]; then
            PROJECT_DIR="SkyTint_NativeOverlay_Project"
          else
            ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo "::error::No Android project found. Upload the extracted project files or the project ZIP."
              ls -la
              exit 1
            fi
            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted
            SETTINGS_FILE="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "::error::No settings.gradle found inside the ZIP."
              find extracted -maxdepth 5 -type f | head -100
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            PROJECT_DIR="${PROJECT_DIR#./}"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using Android project directory: $PROJECT_DIR"

      - name: Generate Gradle Wrapper
        shell: bash
        run: gradle -p "$PROJECT_DIR" wrapper --gradle-version 8.9

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          "$PROJECT_DIR/gradlew" -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyTint-Native-Overlay-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
